<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thalang Group | Diversified Business Group</title>

<meta name="description"
content="Thalang Group is a diversified business group focused on investment, energy, technology, infrastructure and long-term business development.">

<style>
:root{
  --navy:#07141d;
  --navy2:#0c202b;
  --green:#123b2b;
  --green2:#1d5a40;
  --gold:#c8a45d;
  --gold2:#e0c27d;
  --white:#ffffff;
  --light:#f5f7f6;
  --text:#18251f;
  --muted:#69766f;
  --line:#dfe6e2;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  color:var(--text);
  background:var(--white);
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

section{
  padding:100px 0;
}

/* ================= NAVBAR ================= */

header{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(7,20,29,.97);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.navbar{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:white;
  font-size:22px;
  font-weight:800;
  letter-spacing:2px;
}

.logo span{
  color:var(--gold);
}

.nav-links{
  display:flex;
  gap:28px;
}

.nav-links a{
  color:#dbe3df;
  font-size:14px;
  font-weight:600;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--gold);
}

.nav-button{
  padding:11px 18px;
  border:1px solid var(--gold);
  color:var(--gold) !important;
}

/* ================= HERO ================= */

.hero{
  min-height:720px;
  display:flex;
  align-items:center;
  color:white;
  background:
    radial-gradient(circle at 80% 20%,rgba(39,103,72,.5),transparent 35%),
    linear-gradient(135deg,#06131c 0%,#0b2930 50%,#103c2a 100%);
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border:1px solid rgba(200,164,93,.18);
  border-radius:50%;
  right:-180px;
  bottom:-220px;
}

.hero-content{
  max-width:850px;
  position:relative;
  z-index:2;
}

.eyebrow{
  color:var(--gold);
  font-size:13px;
  font-weight:800;
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:22px;
}

.hero h1{
  font-size:clamp(46px,8vw,86px);
  line-height:.98;
  letter-spacing:-3px;
  margin-bottom:28px;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  color:#c9d5d0;
  max-width:680px;
  font-size:18px;
  margin-bottom:35px;
}

.buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:14px 24px;
  font-size:14px;
  font-weight:800;
  border-radius:2px;
  transition:.3s;
}

.btn-gold{
  background:var(--gold);
  color:#101b17;
}

.btn-gold:hover{
  background:var(--gold2);
  transform:translateY(-2px);
}

.btn-outline{
  border:1px solid #7c9589;
  color:white;
}

.btn-outline:hover{
  border-color:white;
  background:white;
  color:var(--navy);
}

/* ================= GROUP BAR ================= */

.group-bar{
  background:#0a1b24;
  color:white;
  border-top:1px solid rgba(255,255,255,.08);
}

.group-bar-inner{
  min-height:105px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.group-bar h3{
  font-size:18px;
}

.group-bar p{
  color:#aebdb6;
  font-size:13px;
}

.group-links{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
}

.group-links span{
  color:#c9d3ce;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
}

/* ================= SECTION HEAD ================= */

.section-label{
  color:var(--green2);
  font-size:12px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:14px;
}

.section-title{
  font-size:clamp(34px,5vw,56px);
  line-height:1.05;
  letter-spacing:-1.5px;
  margin-bottom:20px;
}

.section-text{
  color:var(--muted);
  max-width:700px;
  font-size:16px;
}

/* ================= ABOUT ================= */

.about{
  background:white;
}

.about-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:80px;
  align-items:center;
}

.about-panel{
  min-height:430px;
  padding:55px;
  color:white;
  background:
    linear-gradient(145deg,#0a2118,#164632);
  position:relative;
  overflow:hidden;
}

.about-panel:after{
  content:"TG";
  position:absolute;
  right:-30px;
  bottom:-60px;
  font-size:180px;
  font-weight:900;
  color:rgba(255,255,255,.04);
}

.about-panel .mark{
  font-size:72px;
  color:var(--gold);
  font-weight:900;
  line-height:1;
}

.about-panel h3{
  font-size:30px;
  margin:20px 0 12px;
}

.about-panel p{
  color:#c8d6cf;
  max-width:450px;
}

.about-copy p{
  color:var(--muted);
  margin-top:16px;
}

/* ================= BUSINESS ================= */

.business{
  background:var(--light);
}

.business-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:50px;
}

.business-card{
  background:white;
  border:1px solid var(--line);
  padding:32px;
  min-height:250px;
  position:relative;
  transition:.3s;
}

.business-card:hover{
  transform:translateY(-7px);
  border-color:var(--gold);
  box-shadow:0 18px 45px rgba(8,30,20,.08);
}

.business-number{
  color:#bdc9c2;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

.business-icon{
  width:52px;
  height:52px;
  margin:22px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#edf3ef;
  color:var(--green2);
  font-size:22px;
}

.business-card h3{
  font-size:22px;
  margin-bottom:9px;
}

.business-card p{
  color:var(--muted);
  font-size:14px;
}

/* ================= GROUP STRUCTURE ================= */

.structure{
  background:white;
}

.structure-box{
  margin-top:50px;
  background:#07141d;
  padding:55px 30px;
  color:white;
  text-align:center;
}

.parent{
  display:inline-block;
  padding:20px 45px;
  border:1px solid var(--gold);
  color:var(--gold);
  font-size:18px;
  font-weight:800;
  letter-spacing:2px;
}

.connector{
  width:2px;
  height:45px;
  background:var(--gold);
  margin:auto;
}

.subsidiaries{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.sub{
  padding:18px 8px;
  border:1px solid #30444e;
  color:#d5dfda;
  font-size:12px;
  font-weight:bold;
}

/* ================= INVESTMENT ================= */

.investment{
  background:#f7f8f7;
}

.invest-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
}

.invest-list{
  margin-top:30px;
}

.invest-item{
  padding:18px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:20px;
}

.invest-item strong{
  color:var(--gold);
}

.invest-item p{
  color:var(--muted);
  font-size:14px;
}

.principles{
  background:var(--
